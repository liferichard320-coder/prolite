<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Prolite - Social Media App</title>
  <style>
    :root {
      --bg: #070b10;
      --bg-2: #101821;
      --panel: rgba(18, 26, 34, 0.94);
      --panel-strong: #131d27;
      --header: rgba(12, 18, 24, 0.9);
      --accent: #00e5ff;
      --accent-2: #7a5cff;
      --text: #f5fbff;
      --muted: #a9bac6;
      --chip: rgba(255,255,255,0.05);
      --shadow: rgba(0, 0, 0, 0.42);
      --danger: #ff5b7f;
      --success: #2ed573;
      --gold: #ffca67;
      --glow: rgba(0, 229, 255, 0.35);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      background: linear-gradient(180deg, #05080d, #070b10 35%, #0a1017 100%);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
    }

    body {
      display: flex;
      justify-content: center;
    }

    .app-shell {
      width: 100%;
      max-width: 430px;
      min-height: 100vh;
      background:
        radial-gradient(circle at top, rgba(0, 229, 255, 0.08), transparent 25%),
        linear-gradient(180deg, rgba(7,11,16,0.99), rgba(8,13,18,0.96));
      position: relative;
      overflow: hidden;
      box-shadow: 0 0 25px rgba(0,0,0,0.4);
      display: flex;
      flex-direction: column;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 9;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 18px 18px 12px;
      background: rgba(11, 16, 21, 0.8);
      backdrop-filter: blur(6px);
      border-bottom: 1px solid rgba(255,255,255,0.04);
    }

    .logo {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: 1px;
      color: var(--accent);
      text-shadow: 0 0 18px rgba(0, 229, 255, 0.35);
    }

    .top-actions {
      display: flex;
      gap: 12px;
      font-size: 20px;
      cursor: pointer;
    }

    .page {
      flex: 1;
      overflow-y: auto;
      padding: 18px 14px 100px;
      position: relative;
    }

    .page-panel {
      animation: pageIn 0.42s ease forwards;
      transform: translateY(10px);
      opacity: 0;
    }

    @keyframes pageIn {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .card {
      background: linear-gradient(180deg, rgba(19,29,39,0.96), rgba(17,24,31,0.9));
      border: 1px solid rgba(255,255,255,0.03);
      border-radius: 22px;
      padding: 16px 14px;
      margin: 14px 0;
      box-shadow: 0 16px 30px rgba(0,0,0,0.25);
      transform: translateY(0);
      animation: cardPop 0.35s ease;
    }

    @keyframes cardPop {
      from {
        opacity: 0;
        transform: translateY(18px) scale(0.98);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .video-card {
      overflow: hidden;
      background: linear-gradient(180deg, rgba(19,29,39,0.98), rgba(12,18,25,0.95));
      border-radius: 24px;
      margin: 16px 0;
      border: 1px solid rgba(255,255,255,0.03);
      box-shadow: 0 18px 30px rgba(0,0,0,0.32);
      animation: floatIn 0.45s ease;
    }

    @keyframes floatIn {
      from {
        opacity: 0;
        transform: translateY(22px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .video-box {
      width: 100%;
      height: 270px;
      overflow: hidden;
      position: relative;
      background: #0b0f14;
    }

    .video-box::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, transparent 0%, rgba(0,0,0,0.2) 100%);
      pointer-events: none;
    }

    video {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      background: #000;
    }

    .video-info {
      padding: 14px;
    }

    h3 {
      margin: 0 0 12px;
      font-size: 20px;
      letter-spacing: 0.2px;
    }

    .meta {
      color: var(--muted);
      font-size: 14px;
      margin-bottom: 6px;
    }

    .creator-name {
      color: var(--accent);
      font-weight: 700;
    }

    .caption {
      margin: 10px 0 14px;
      font-size: 16px;
      line-height: 1.5;
      color: #edf5ff;
    }

    .action-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    button {
      border: 0;
      border-radius: 999px;
      background: rgba(255,255,255,0.05);
      color: var(--text);
      padding: 10px 14px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.03);
    }

    button:hover {
      transform: translateY(-2px);
      background: rgba(255,255,255,0.09);
    }

    button.primary {
      background: linear-gradient(135deg, var(--accent), #67d9ff);
      color: #04181d;
      box-shadow: 0 10px 20px rgba(0, 229, 255, 0.3);
    }

    button.primary:hover {
      background: linear-gradient(135deg, #47ebff, #00c9ff);
    }

    button.danger {
      background: linear-gradient(135deg, var(--danger), #ff7a8d);
      color: white;
    }

    button.danger:hover {
      background: linear-gradient(135deg, #ff4b70, #ff738b);
    }

    .chip-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(120px, 1fr));
      gap: 10px;
    }

    .wallet-box {
      margin: 10px 0;
      background: linear-gradient(135deg, rgba(0,229,255,0.08), rgba(122,92,255,0.08));
      border-radius: 16px;
      padding: 14px;
      border: 1px solid rgba(0,229,255,0.12);
      box-shadow: inset 0 0 18px rgba(0, 229, 255, 0.08);
    }

    .wallet-balance {
      font-size: 28px;
      font-weight: 800;
      margin: 8px 0;
      color: var(--text);
    }

    .wallet-small {
      font-size: 12px;
      color: var(--muted);
    }

    .nav {
      position: fixed;
      left: 50%;
      bottom: 0;
      transform: translateX(-50%);
      width: min(100%, 430px);
      background: rgba(12, 17, 22, 0.95);
      backdrop-filter: blur(12px);
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding: 12px 10px 18px;
      border-top: 1px solid rgba(255,255,255,0.06);
      box-shadow: 0 -15px 25px rgba(0,0,0,0.25);
    }

    .nav-item {
      text-align: center;
      font-size: 12px;
      color: var(--muted);
      min-width: 58px;
      cursor: pointer;
      transition: transform 0.2s ease, color 0.2s ease;
      padding: 2px 0;
    }

    .nav-item:hover {
      transform: translateY(-2px);
    }

    .nav-item .icon {
      display: block;
      font-size: 22px;
      margin-bottom: 3px;
    }

    .nav-item.active {
      color: var(--accent);
      text-shadow: 0 0 12px rgba(0, 229, 255, 0.35);
    }

    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.72);
      z-index: 100;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal.active {
      display: flex;
      animation: modalFade 0.25s ease;
    }

    @keyframes modalFade {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .modal-content {
      background: linear-gradient(180deg, rgba(20,28,35,1), rgba(13,19,27,1));
      border: 1px solid rgba(255,255,255,0.04);
      border-radius: 24px;
      padding: 30px 22px;
      width: 90%;
      max-width: 380px;
      text-align: center;
      box-shadow: 0 18px 30px rgba(0,0,0,0.35);
      animation: slideUp 0.3s ease;
    }

    @keyframes slideUp {
      from {
        transform: translateY(30px) scale(0.98);
        opacity: 0;
      }
      to {
        transform: translateY(0) scale(1);
        opacity: 1;
      }
    }

    .modal-content h2 {
      margin-top: 0;
      color: var(--accent);
      font-size: 28px;
      letter-spacing: 1px;
    }

    .form-group {
      margin: 20px 0;
      text-align: left;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      color: var(--muted);
    }

    .form-group input,
    .form-group textarea {
      width: 100%;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.08);
      background: rgba(255,255,255,0.04);
      color: var(--text);
      font-size: 14px;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .form-group input:focus,
    .form-group textarea:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(0,229,255,0.12);
    }

    .form-group input::placeholder,
    .form-group textarea::placeholder {
      color: var(--muted);
    }

    .modal-actions {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }

    .modal-actions button {
      flex: 1;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin: 10px 0;
    }

    .stat-item {
      background: rgba(255,255,255,0.02);
      padding: 12px 8px;
      border-radius: 12px;
      text-align: center;
      border: 1px solid rgba(255,255,255,0.02);
    }

    .stat-value {
      font-size: 20px;
      font-weight: 800;
      color: var(--accent);
    }

    .stat-label {
      font-size: 11px;
      color: var(--muted);
      margin-top: 5px;
    }

    .profile-header {
      text-align: center;
      margin-bottom: 20px;
    }

    .profile-avatar {
      width: 82px;
      height: 82px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      margin: 0 auto 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 38px;
      box-shadow: 0 12px 25px rgba(0, 229, 255, 0.2);
      animation: pulseGlow 2s infinite ease-in-out;
    }

    @keyframes pulseGlow {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.06); }
    }

    .profile-name {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 4px;
    }

    .profile-username {
      color: var(--muted);
      font-size: 14px;
    }

    .profile-bio {
      color: var(--muted);
      font-size: 14px;
      margin-top: 12px;
      line-height: 1.4;
    }

    .toast {
      position: fixed;
      bottom: 100px;
      left: 50%;
      transform: translateX(-50%);
      background: linear-gradient(135deg, rgba(0,229,255,0.95), rgba(122,92,255,0.95));
      color: #06171d;
      padding: 12px 18px;
      border-radius: 999px;
      font-size: 14px;
      font-weight: 700;
      z-index: 60;
      box-shadow: 0 10px 25px rgba(0,229,255,0.25);
      animation: toastIn 0.28s ease;
    }

    @keyframes toastIn {
      from { opacity: 0; transform: translateX(-50%) translateY(10px); }
      to { opacity: 1; transform: translateX(-50%) translateY(0); }
    }

    .empty-state {
      text-align: center;
      padding: 32px 16px;
      color: var(--muted);
      font-size: 14px;
    }

    .empty-state-icon {
      font-size: 42px;
      margin-bottom: 12px;
    }

    @media (max-width: 420px) {
      .logo { font-size: 24px; }
      .video-box { height: 220px; }
      .card { border-radius: 18px; }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <header>
      <div class="logo">PROLITE</div>
      <div class="top-actions">
        <span id="notificationBell" title="Notifications">🔔</span>
        <span id="walletIcon" title="Wallet">💰</span>
      </div>
    </header>

    <main class="page" id="page"></main>

    <nav class="nav" aria-label="Main navigation">
      <div class="nav-item active" data-page="home"><span class="icon">🏠</span>Home</div>
      <div class="nav-item" data-page="discover"><span class="icon">🔎</span>Discover</div>
      <div class="nav-item" data-page="create"><span class="icon">➕</span>Create</div>
      <div class="nav-item" data-page="chat"><span class="icon">💬</span>Chat</div>
      <div class="nav-item" data-page="profile"><span class="icon">👤</span>Profile</div>
    </nav>
  </div>

  <div class="modal" id="loginModal">
    <div class="modal-content">
      <h2>PROLITE</h2>
      <p style="color: var(--muted); margin-bottom: 20px;">Welcome to the social media revolution</p>

      <div class="form-group">
        <label>Username</label>
        <input type="text" id="loginUsername" placeholder="Enter username" />
      </div>

      <div class="form-group">
        <label>Password</label>
        <input type="password" id="loginPassword" placeholder="Enter password" />
      </div>

      <div style="text-align: left; font-size: 12px; color: var(--muted); margin: 14px 0;">
        Demo login:<br>
        <strong>creator1 / 123456</strong><br>
        <strong>creator2 / 123456</strong>
      </div>

      <div class="modal-actions">
        <button class="primary" style="flex: 1;" id="loginBtn">Sign In</button>
      </div>
    </div>
  </div>

  <div class="modal" id="notificationModal">
    <div class="modal-content">
      <h2>🔔 Notifications</h2>
      <div id="notificationList" style="text-align: left; margin-top: 20px;"></div>
      <button class="primary" style="width: 100%; margin-top: 16px;" onclick="closeNotificationModal()">Close</button>
    </div>
  </div>

  <div class="modal" id="walletModal">
    <div class="modal-content">
      <h2>💰 Wallet</h2>
      <div class="wallet-box">
        <div class="wallet-small">Current Balance</div>
        <div class="wallet-balance">₦2,500.00</div>
      </div>

      <div class="stats">
        <div class="stat-item">
          <div class="stat-value">₦1,200</div>
          <div class="stat-label">Gifts</div>
        </div>
        <div class="stat-item">
          <div class="stat-value">₦800</div>
          <div class="stat-label">Subs</div>
        </div>
        <div class="stat-item">
          <div class="stat-value">₦500</div>
          <div class="stat-label">Other</div>
        </div>
      </div>

      <div class="modal-actions">
        <button class="primary">💳 Add</button>
        <button>➖ Withdraw</button>
      </div>
      <button style="width: 100%; margin-top: 12px;" onclick="closeWalletModal()">Close</button>
    </div>
  </div>

  <script>
    const dummyUsers = {
      creator1: { password: '123456', name: 'Alex Creator', avatar: '👨‍🎬', followers: 25000, following: 342, posts: 156 },
      creator2: { password: '123456', name: 'Sarah Content', avatar: '👩‍🎤', followers: 18500, following: 521, posts: 243 }
    };

    const dummyFeed = [
      { id:1, creator:'@alexcreator', name:'Alex Creator', followers:'25K', avatar:'👨‍🎬', video:'https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4', poster:'https://images.unsplash.com/photo-1517694712202-14dd9538aa97?auto=format&fit=crop&w=900&q=80', caption:'Just dropped my new vlog! Check it out 🔥', likes:3250, comments:842, shares:156, liked:false },
      { id:2, creator:'@sarahcontent', name:'Sarah Content', followers:'18K', avatar:'👩‍🎤', video:'https://interactive-examples.mdn.mozilla.net/media/cc0-videos/butterfly.mp4', poster:'https://images.unsplash.com/photo-1511379938547-c1f69b13d835?auto=format&fit=crop&w=900&q=80', caption:'Music production tips for beginners 🎵🎧', likes:2145, comments:521, shares:89, liked:false },
      { id:3, creator:'@creativemind', name:'Creative Mind', followers:'12K', avatar:'🎨', video:'https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4', poster:'https://images.unsplash.com/photo-1492691527719-9d1e07e534b4?auto=format&fit=crop&w=900&q=80', caption:'Art tutorial: Digital painting techniques 🎭', likes:1876, comments:432, shares:67, liked:false },
      { id:4, creator:'@fitnessjoy', name:'Fitness Joy', followers:'8K', avatar:'💪', video:'https://interactive-examples.mdn.mozilla.net/media/cc0-videos/butterfly.mp4', poster:'https://images.unsplash.com/photo-1534438327276-14e5300c3a48?auto=format&fit=crop&w=900&q=80', caption:'Beginner workout routine - No equipment needed! 🏋️‍♀️', likes:4521, comments:892, shares:234, liked:false }
    ];

    const dummyChats = [
      { id:1, name:'Alex Creator', avatar:'👨‍🎬', lastMessage:'Hey, love your content!', time:'2m' },
      { id:2, name:'Sarah Content', avatar:'👩‍🎤', lastMessage:'Thanks for the collab idea', time:'1h' },
      { id:3, name:'Creative Mind', avatar:'🎨', lastMessage:'Let\'s go live together!', time:'3h' }
    ];

    const dummyNotifications = [
      { type:'❤️', message:'alexcreator liked your video', time:'5m' },
      { type:'💬', message:'sarahcontent commented on your post', time:'12m' },
      { type:'👥', message:'creativemind started following you', time:'1h' },
      { type:'🎁', message:'You received 50 gifts from fitnessjoy', time:'2h' }
    ];

    let currentUser = null;

    function init() {
      const storedUser = localStorage.getItem('proliteUser');
      if (storedUser) {
        currentUser = JSON.parse(storedUser);
        renderApp('home');
      } else {
        document.getElementById('loginModal').classList.add('active');
      }
    }

    document.getElementById('loginBtn').addEventListener('click', () => {
      const username = document.getElementById('loginUsername').value.trim();
      const password = document.getElementById('loginPassword').value;

      if (!username || !password) {
        showToast('Please enter username and password');
        return;
      }

      if (dummyUsers[username] && dummyUsers[username].password === password) {
        currentUser = { username, ...dummyUsers[username] };
        localStorage.setItem('proliteUser', JSON.stringify(currentUser));
        document.getElementById('loginModal').classList.remove('active');
        renderApp('home');
      } else {
        showToast('Invalid credentials');
      }
    });

    document.getElementById('loginPassword').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') document.getElementById('loginBtn').click();
    });

    document.getElementById('notificationBell').addEventListener('click', openNotificationModal);
    document.getElementById('walletIcon').addEventListener('click', openWalletModal);

    document.querySelectorAll('.nav-item').forEach(item => {
      item.addEventListener('click', () => {
        document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
        item.classList.add('active');
        renderApp(item.dataset.page);
      });
    });

    function renderApp(page) {
      const root = document.getElementById('page');
      root.className = 'page page-panel';

      switch (page) {
        case 'home':
          root.innerHTML = `
            <h3>🎬 Video Feed</h3>
            ${dummyFeed.map(post => `
              <div class="video-card">
                <div class="video-box">
                  <video controls playsinline poster="${post.poster}">
                    <source src="${post.video}" type="video/mp4" />
                  </video>
                </div>
                <div class="video-info">
                  <div class="meta"><span class="creator-name">${post.creator}</span> • ${post.followers} followers</div>
                  <p class="caption">${post.caption}</p>
                  <div class="action-row">
                    <button onclick="toggleLike(${post.id})" id="like-${post.id}">❤️ ${post.likes}</button>
                    <button>💬 ${post.comments}</button>
                    <button>↗️ ${post.shares}</button>
                    <button class="primary">➕ Follow</button>
                  </div>
                </div>
              </div>
            `).join('')}
          `;
          break;

        case 'discover':
          root.innerHTML = `
            <div class="card">
              <h3>🌍 Discover</h3>
              <div style="display: grid; gap: 12px;">
                <div style="padding: 14px; border-radius: 14px; background: rgba(255,255,255,0.03);">
                  <div style="font-weight: 800; margin-bottom: 4px;">#DanceChallenge</div>
                  <div style="font-size: 12px; color: var(--muted);">2.5M views • Trending</div>
                </div>
                <div style="padding: 14px; border-radius: 14px; background: rgba(255,255,255,0.03);">
                  <div style="font-weight: 800; margin-bottom: 4px;">#FitnessMotivation</div>
                  <div style="font-size: 12px; color: var(--muted);">1.8M views • Trending</div>
                </div>
                <div style="padding: 14px; border-radius: 14px; background: rgba(255,255,255,0.03);">
                  <div style="font-weight: 800; margin-bottom: 4px;">#MusicProduction</div>
                  <div style="font-size: 12px; color: var(--muted);">1.2M views • Trending</div>
                </div>
              </div>
            </div>

            <div class="card">
              <h3>👥 Suggested</h3>
              <div style="display: grid; gap: 12px;">
                <div style="display:flex; justify-content:space-between; align-items:center; padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,0.04);">
                  <div>
                    <div style="font-weight:700;">Dev Ninja 🥷</div>
                    <div style="font-size:12px; color: var(--muted);">2.5K followers</div>
                  </div>
                  <button class="primary" style="padding: 8px 12px; font-size: 12px;">Follow</button>
                </div>
                <div style="display:flex; justify-content:space-between; align-items:center; padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,0.04);">
                  <div>
                    <div style="font-weight:700;">Travel Bug 🌴</div>
                    <div style="font-size:12px; color: var(--muted);">3.1K followers</div>
                  </div>
                  <button class="primary" style="padding: 8px 12px; font-size: 12px;">Follow</button>
                </div>
                <div style="display:flex; justify-content:space-between; align-items:center; padding: 10px 0;">
                  <div>
                    <div style="font-weight:700;">Food Master 🍕</div>
                    <div style="font-size:12px; color: var(--muted);">1.8K followers</div>
                  </div>
                  <button class="primary" style="padding: 8px 12px; font-size: 12px;">Follow</button>
                </div>
              </div>
            </div>
          `;
          break;

        case 'create':
          root.innerHTML = `
            <h3>➕ Create</h3>
            <div class="card">
              <h3>📹 Choose Format</h3>
              <div class="chip-grid">
                <button class="primary">🎥 Short</button>
                <button class="primary">🎞️ Long</button>
                <button class="primary">📢 Status</button>
                <button class="primary">🔴 Live</button>
              </div>
            </div>

            <div class="card">
              <h3>📋 New Post</h3>
              <div class="form-group">
                <label>Caption</label>
                <textarea id="postCaption" placeholder="What's on your mind?" style="min-height: 110px;"></textarea>
              </div>
              <div class="form-group">
                <label>Media</label>
                <input type="file" accept="video/*,image/*" />
              </div>
              <button class="primary" style="width:100%;" onclick="publishPost()">📤 Publish</button>
            </div>
          `;
          break;

        case 'chat':
          root.innerHTML = `
            <h3>💬 Messages</h3>
            <div style="display:grid; gap: 10px;">
              ${dummyChats.map(chat => `
                <div class="card" style="display:flex; justify-content:space-between; align-items:center; padding: 12px 14px;">
                  <div style="display:flex; align-items:center; gap: 12px;">
                    <div style="font-size: 32px;">${chat.avatar}</div>
                    <div>
                      <div style="font-weight:700;">${chat.name}</div>
                      <div style="font-size: 12px; color: var(--muted);">${chat.lastMessage}</div>
                    </div>
                  </div>
                  <div style="font-size: 12px; color: var(--muted);">${chat.time}</div>
                </div>
              `).join('')}
            </div>
          `;
          break;

        case 'profile':
          root.innerHTML = `
            <div class="card">
              <div class="profile-header">
                <div class="profile-avatar">${currentUser.avatar}</div>
                <div class="profile-name">${currentUser.name}</div>
                <div class="profile-username">@${currentUser.username}</div>
                <div class="profile-bio">Creating amazing content every day! 🎬✨</div>
              </div>

              <div class="stats">
                <div class="stat-item">
                  <div class="stat-value">${currentUser.followers.toLocaleString()}</div>
                  <div class="stat-label">Followers</div>
                </div>
                <div class="stat-item">
                  <div class="stat-value">${currentUser.following}</div>
                  <div class="stat-label">Following</div>
                </div>
                <div class="stat-item">
                  <div class="stat-value">${currentUser.posts}</div>
                  <div class="stat-label">Posts</div>
                </div>
              </div>

              <div class="action-row" style="margin-top: 18px;">
                <button style="flex:1;">✏️ Edit</button>
                <button style="flex:1;">⚙️ Settings</button>
              </div>
            </div>

            <div class="card">
              <h3>📊 Performance</h3>
              <div class="stats">
                <div class="stat-item">
                  <div class="stat-value">156K</div>
                  <div class="stat-label">Views</div>
                </div>
                <div class="stat-item">
                  <div class="stat-value">42K</div>
                  <div class="stat-label">Likes</div>
                </div>
                <div class="stat-item">
                  <div class="stat-value">8.2K</div>
                  <div class="stat-label">Comments</div>
                </div>
              </div>
            </div>

            <div class="card">
              <button class="danger" style="width:100%;" onclick="logout()">🚪 Logout</button>
            </div>
          `;
          break;
      }
    }

    function toggleLike(postId) {
      const post = dummyFeed.find(item => item.id === postId);
      if (!post) return;
      post.liked = !post.liked;
      const btn = document.getElementById(`like-${postId}`);
      post.likes += post.liked ? 1 : -1;
      btn.innerHTML = `❤️ ${post.likes}`;
      btn.style.background = post.liked ? 'linear-gradient(135deg, #ff5b7f, #ff8c9c)' : 'rgba(255,255,255,0.05)';
      btn.style.color = post.liked ? '#fff' : 'var(--text)';
      showToast(post.liked ? 'Liked post' : 'Removed like');
    }

    function publishPost() {
      const caption = document.getElementById('postCaption')?.value || '';
      if (!caption.trim()) {
        showToast('Please add a caption');
        return;
      }
      showToast('Post published successfully! 🎉');
      document.getElementById('postCaption').value = '';
    }

    function openNotificationModal() {
      const list = document.getElementById('notificationList');
      list.innerHTML = dummyNotifications.map(n => `
        <div style="padding: 12px 10px; background: rgba(255,255,255,0.02); border-radius: 12px; margin-bottom: 10px;">
          <div style="font-size: 18px; margin-bottom: 5px;">${n.type}</div>
          <div>${n.message}</div>
          <div style="font-size: 11px; color: var(--muted); margin-top: 6px;">${n.time}</div>
        </div>
      `).join('');
      document.getElementById('notificationModal').classList.add('active');
    }

    function closeNotificationModal() {
      document.getElementById('notificationModal').classList.remove('active');
    }

    function openWalletModal() {
      document.getElementById('walletModal').classList.add('active');
    }

    function closeWalletModal() {
      document.getElementById('walletModal').classList.remove('active');
    }

    function logout() {
      localStorage.removeItem('proliteUser');
      currentUser = null;
      document.getElementById('loginUsername').value = '';
      document.getElementById('loginPassword').value = '';
      document.getElementById('loginModal').classList.add('active');
      renderApp('home');
    }

    function showToast(message) {
      const existing = document.querySelector('.toast');
      if (existing) existing.remove();
      const toast = document.createElement('div');
      toast.className = 'toast';
      toast.textContent = message;
      document.body.appendChild(toast);
      setTimeout(() => toast.remove(), 1800);
    }

    document.getElementById('notificationModal').addEventListener('click', (e) => {
      if (e.target.id === 'notificationModal') closeNotificationModal();
    });

    document.getElementById('walletModal').addEventListener('click', (e) => {
      if (e.target.id === 'walletModal') closeWalletModal();
    });

    init();
  </script>
</body>
</html>
