<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Prolite - Social Media App</title>
  <style>
    :root {
      --bg: #080808;
      --panel: #171717;
      --panel-2: #222222;
      --header: #111111;
      --accent: #00e5ff;
      --text: #ffffff;
      --muted: #b4b4b4;
      --chip: #272727;
      --shadow: rgba(0, 0, 0, 0.35);
      --danger: #ff4757;
      --success: #2ed573;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
    }

    body {
      display: flex;
      justify-content: center;
      background:
        radial-gradient(circle at top, rgba(0, 229, 255, 0.08), transparent 30%),
        var(--bg);
    }

    .app-shell {
      width: 100%;
      max-width: 430px;
      min-height: 100vh;
      background: var(--bg);
      position: relative;
      box-shadow: 0 0 25px var(--shadow);
      display: flex;
      flex-direction: column;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 18px 18px 14px;
      background: rgba(17, 17, 17, 0.96);
      backdrop-filter: blur(6px);
    }

    .logo {
      font-size: 26px;
      font-weight: bold;
      letter-spacing: 1px;
      color: var(--accent);
    }

    .top-actions {
      display: flex;
      gap: 12px;
      font-size: 20px;
      cursor: pointer;
    }

    .page {
      flex: 1;
      overflow-y: auto;
      padding: 12px 15px 88px 15px;
    }

    .card {
      background: var(--panel);
      border-radius: 18px;
      padding: 16px 14px;
      margin: 12px 0;
      box-shadow: 0 8px 18px rgba(0,0,0,0.18);
    }

    .video-card {
      background: var(--panel);
      border-radius: 18px;
      overflow: hidden;
      margin: 12px 0;
      box-shadow: 0 8px 18px rgba(0,0,0,0.18);
    }

    .video-box {
      background: linear-gradient(145deg, #2b2b2b, #161616);
      border-radius: 0;
      overflow: hidden;
      width: 100%;
      height: 280px;
    }

    video {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      background: #000;
    }

    .video-info {
      padding: 14px;
    }

    h3 {
      margin: 0 0 12px;
      font-size: 20px;
    }

    .meta {
      color: var(--muted);
      font-size: 14px;
      margin-bottom: 8px;
    }

    .creator-name {
      font-weight: 600;
      color: var(--accent);
    }

    .caption {
      margin: 10px 0 14px;
      font-size: 16px;
      line-height: 1.4;
    }

    .action-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    button {
      border: 0;
      border-radius: 22px;
      background: var(--chip);
      color: var(--text);
      padding: 10px 14px;
      font-size: 14px;
      cursor: pointer;
      transition: transform 0.15s ease, background 0.15s ease;
      font-weight: 500;
    }

    button:hover {
      transform: translateY(-1px);
      background: var(--panel-2);
    }

    button.primary {
      background: var(--accent);
      color: #051d22;
      font-weight: bold;
    }

    button.primary:hover {
      background: #00d9f0;
    }

    button.danger {
      background: var(--danger);
      color: white;
    }

    button.danger:hover {
      background: #ff3838;
    }

    .chip-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }

    .wallet-box {
      margin: 10px 0;
      background: rgba(255,255,255,0.02);
      border-radius: 12px;
      padding: 14px;
      border-left: 3px solid var(--accent);
    }

    .wallet-balance {
      font-size: 28px;
      font-weight: bold;
      margin: 8px 0;
    }

    .wallet-small {
      font-size: 12px;
      color: var(--muted);
    }

    .nav {
      position: fixed;
      left: 50%;
      bottom: 0;
      transform: translateX(-50%);
      width: min(100%, 430px);
      background: rgba(17, 17, 17, 0.96);
      backdrop-filter: blur(8px);
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding: 12px 10px 18px;
      border-top: 1px solid rgba(255,255,255,0.06);
    }

    .nav-item {
      text-align: center;
      font-size: 12px;
      color: var(--muted);
      min-width: 58px;
      cursor: pointer;
      transition: color 0.2s;
    }

    .nav-item .icon {
      display: block;
      font-size: 22px;
      margin-bottom: 3px;
    }

    .nav-item.active {
      color: var(--accent);
    }

    /* Modal styles */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.7);
      z-index: 100;
      align-items: center;
      justify-content: center;
    }

    .modal.active {
      display: flex;
    }

    .modal-content {
      background: var(--panel);
      border-radius: 20px;
      padding: 30px;
      width: 90%;
      max-width: 380px;
      text-align: center;
      animation: slideUp 0.3s ease;
    }

    @keyframes slideUp {
      from { transform: translateY(40px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    .modal-content h2 {
      margin-top: 0;
      color: var(--accent);
      font-size: 28px;
    }

    .form-group {
      margin: 20px 0;
      text-align: left;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      color: var(--muted);
    }

    .form-group input {
      width: 100%;
      padding: 12px;
      border: 1px solid rgba(255,255,255,0.1);
      background: rgba(255,255,255,0.05);
      border-radius: 10px;
      color: var(--text);
      font-size: 14px;
    }

    .form-group input::placeholder {
      color: var(--muted);
    }

    .form-group input:focus {
      outline: none;
      border-color: var(--accent);
      background: rgba(0, 229, 255, 0.05);
    }

    .modal-actions {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }

    .modal-actions button {
      flex: 1;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin: 10px 0;
    }

    .stat-item {
      background: rgba(255,255,255,0.02);
      padding: 12px;
      border-radius: 12px;
      text-align: center;
    }

    .stat-value {
      font-size: 20px;
      font-weight: bold;
      color: var(--accent);
    }

    .stat-label {
      font-size: 11px;
      color: var(--muted);
      margin-top: 4px;
    }

    .hidden {
      display: none !important;
    }

    .profile-header {
      text-align: center;
      margin-bottom: 20px;
    }

    .profile-avatar {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), #00a8cc);
      margin: 0 auto 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 40px;
    }

    .profile-name {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 4px;
    }

    .profile-username {
      color: var(--muted);
      font-size: 14px;
    }

    .profile-bio {
      color: var(--muted);
      font-size: 14px;
      margin-top: 12px;
    }

    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: var(--muted);
    }

    .empty-state-icon {
      font-size: 48px;
      margin-bottom: 12px;
    }

    @media (max-width: 420px) {
      .logo { font-size: 24px; }
      .card { border-radius: 16px; }
      .video-box { height: 220px; }
    }

    /* Notification toast */
    .toast {
      position: fixed;
      bottom: 100px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--accent);
      color: #051d22;
      padding: 12px 20px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: bold;
      animation: slideUp 0.3s ease;
      z-index: 50;
    }

    .loading {
      display: inline-block;
      width: 12px;
      height: 12px;
      background: currentColor;
      border-radius: 50%;
      animation: pulse 1s infinite;
      margin-right: 8px;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <header>
      <div class="logo">PROLITE</div>
      <div class="top-actions">
        <span id="notificationBell" title="Notifications">🔔</span>
        <span id="walletIcon" title="Wallet">💰</span>
      </div>
    </header>

    <main class="page" id="page">
      <!-- Content dynamically rendered here -->
    </main>

    <nav class="nav" aria-label="Main navigation">
      <div class="nav-item active" data-page="home"><span class="icon">🏠</span>Home</div>
      <div class="nav-item" data-page="discover"><span class="icon">🔎</span>Discover</div>
      <div class="nav-item" data-page="create"><span class="icon">➕</span>Create</div>
      <div class="nav-item" data-page="chat"><span class="icon">💬</span>Chat</div>
      <div class="nav-item" data-page="profile"><span class="icon">👤</span>Profile</div>
    </nav>
  </div>

  <!-- Login Modal -->
  <div class="modal" id="loginModal">
    <div class="modal-content">
      <h2>PROLITE</h2>
      <p style="color: var(--muted); margin-bottom: 24px;">Welcome to the social media revolution</p>
      
      <div class="form-group">
        <label>Username</label>
        <input type="text" id="loginUsername" placeholder="Enter username" />
      </div>
      
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="loginPassword" placeholder="Enter password" />
      </div>

      <div style="text-align: left; font-size: 12px; color: var(--muted); margin: 16px 0;">
        <strong>Demo credentials:</strong><br>
        Username: creator1 | Password: 123456<br>
        Username: creator2 | Password: 123456
      </div>

      <div class="modal-actions">
        <button class="primary" style="flex: 1;" id="loginBtn">Sign In</button>
      </div>
    </div>
  </div>

  <!-- Notification Modal -->
  <div class="modal" id="notificationModal">
    <div class="modal-content">
      <h2>🔔 Notifications</h2>
      <div id="notificationList" style="text-align: left; margin-top: 20px;">
        <!-- Notifications rendered here -->
      </div>
      <button class="primary" style="width: 100%; margin-top: 20px;" onclick="closeNotificationModal()">Close</button>
    </div>
  </div>

  <!-- Wallet Modal -->
  <div class="modal" id="walletModal">
    <div class="modal-content">
      <h2>💰 Wallet</h2>
      <div class="wallet-box">
        <div class="wallet-small">Current Balance</div>
        <div class="wallet-balance" id="walletDisplay">₦2,500.00</div>
      </div>
      
      <div class="stats">
        <div class="stat-item">
          <div class="stat-value" id="giftsTotal">₦1,200</div>
          <div class="stat-label">From Gifts</div>
        </div>
        <div class="stat-item">
          <div class="stat-value" id="subTotal">₦800</div>
          <div class="stat-label">Subscriptions</div>
        </div>
        <div class="stat-item">
          <div class="stat-value" id="othersTotal">₦500</div>
          <div class="stat-label">Other</div>
        </div>
      </div>

      <div class="modal-actions" style="margin-top: 24px;">
        <button class="primary">💳 Add Funds</button>
        <button>➖ Withdraw</button>
      </div>

      <button style="width: 100%; margin-top: 12px;" onclick="closeWalletModal()">Close</button>
    </div>
  </div>

  <script>
    // Dummy data
    const dummyUsers = {
      'creator1': { password: '123456', name: 'Alex Creator', avatar: '👨‍🎬', followers: 25000, following: 342, posts: 156 },
      'creator2': { password: '123456', name: 'Sarah Content', avatar: '👩‍🎤', followers: 18500, following: 521, posts: 243 }
    };

    const dummyFeed = [
      {
        id: 1,
        creator: '@alexcreator',
        name: 'Alex Creator',
        followers: '25K',
        avatar: '👨‍🎬',
        video: 'https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4',
        poster: 'https://images.unsplash.com/photo-1517694712202-14dd9538aa97?auto=format&fit=crop&w=900&q=80',
        caption: 'Just dropped my new vlog! Check it out 🔥',
        likes: 3250,

      },
      {
        id: 2,

        video: 'https://interactive-examples.mdn.mozilla.net/media/cc0-videos/butterfly.mp4',
        poster: 'https://images.unsplash.com/photo-1511379938547-c1f69b13d835?auto=format&fit=crop&w=900&q=80',
        caption: 'Music production tips for beginners 🎵🎧',
        likes: 2145,
        comments: 521,

      },
      {
        id: 3,
        creator: '@creativemind',

        avatar: '🎨',

        poster: 'https://images.unsplash.com/photo-1517694712202-14dd9538aa97?auto=format&fit=crop&w=900&q=80',
        caption: 'Art tutorial: Digital painting techniques 🎭',
        likes: 1876,
        comments: 432,
        shares: 67,
        liked: false
      },
      {
        id: 4,
        creator: '@fitnessjoy',
        name: 'Fitness Joy',
        followers: '8K',
        avatar: '💪',
        video: 'https://interactive-examples.mdn.mozilla.net/media/cc0-videos/butterfly.mp4',
        poster: 'https://images.unsplash.com/photo-1534438327276-14e5300c3a48?auto=format&fit=crop&w=900&q=80',
        caption: 'Beginner workout routine - No equipment needed! 🏋️‍♀️',
        likes: 4521,
        comments: 892,
        shares: 234,
        liked: false
      },
      {
        id: 5,
        creator: '@techsolutions',
        name: 'Tech Solutions',
        followers: '15K',
        avatar: '💻',
        video: 'https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4',
        poster: 'https://images.unsplash.com/photo-1517694712202-14dd9538aa97?auto=format&fit=crop&w=900&q=80',
        caption: 'Web development tricks that will blow your mind 🚀',
        likes: 2987,
        comments: 654,
        shares: 123,
        liked: false
      }
    ];

    const dummyChats = [
      { id: 1, name: 'Alex Creator', avatar: '👨‍🎬', lastMessage: 'Hey, love your content!', time: '2m' },
      { id: 2, name: 'Sarah Content', avatar: '👩‍🎤', lastMessage: 'Thanks for the collab idea', time: '1h' },
      { id: 3, name: 'Creative Mind', avatar: '🎨', lastMessage: 'Let\'s go live together!', time: '3h' }
    ];

    const dummyNotifications = [
      { id: 1, type: '❤️', message: 'alexcreator liked your video', time: '5m' },
      { id: 2, type: '💬', message: 'sarahcontent commented on your post', time: '12m' },
      { id: 3, type: '👥', message: 'creativemind started following you', time: '1h' },
      { id: 4, type: '🎁', message: 'You received 50 gifts from fitnessjoy', time: '2h' }
    ];

    let currentUser = null;
    let currentPage = 'home';

    // Initialize app
    function init() {
      const storedUser = localStorage.getItem('proliteUser');
      if (storedUser) {
        currentUser = JSON.parse(storedUser);
        document.getElementById('loginModal').classList.remove('active');
        renderPage('home');
      } else {
        document.getElementById('loginModal').classList.add('active');
      }
    }

    // Login handler
    document.getElementById('loginBtn').addEventListener('click', () => {
      const username = document.getElementById('loginUsername').value.trim();
      const password = document.getElementById('loginPassword').value;

      if (!username || !password) {
        showToast('Please enter username and password');
        return;
      }

      if (dummyUsers[username] && dummyUsers[username].password === password) {
        currentUser = { username, ...dummyUsers[username] };
        localStorage.setItem('proliteUser', JSON.stringify(currentUser));
        document.getElementById('loginModal').classList.remove('active');
        renderPage('home');
      } else {
        showToast('Invalid credentials');
      }
    });

    // Allow Enter key to login
    document.getElementById('loginPassword').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') document.getElementById('loginBtn').click();
    });

    // Navigation
    document.querySelectorAll('.nav-item').forEach(item => {
      item.addEventListener('click', () => {
        const page = item.dataset.page;
        document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
        item.classList.add('active');
        renderPage(page);
      });
    });

    // Notification bell
    document.getElementById('notificationBell').addEventListener('click', openNotificationModal);

    // Wallet icon
    document.getElementById('walletIcon').addEventListener('click', openWalletModal);

    // Render pages
    function renderPage(page) {
      currentPage = page;
      const pageEl = document.getElementById('page');
      
      switch(page) {
        case 'home':
          renderHome();
          break;
        case 'discover':
          renderDiscover();
          break;
        case 'create':
          renderCreate();
          break;
        case 'chat':
          renderChat();
          break;
        case 'profile':
          renderProfile();
          break;
      }
      
      pageEl.scrollTop = 0;
    }

    function renderHome() {
      const pageEl = document.getElementById('page');
      pageEl.innerHTML = '<h3 style="padding: 0 0 10px; margin: 0;">🎬 Feed</h3>' + 
        dummyFeed.map(post => `
          <div class="video-card">
            <div class="video-box">
              <video controls playsinline poster="${post.poster}">
                <source src="${post.video}" type="video/mp4" />
              </video>
            </div>
            <div class="video-info">
              <div class="meta"><span class="creator-name">${post.creator}</span> • ${post.followers} followers</div>
              <p class="caption">${post.caption}</p>
              <div class="action-row">
                <button onclick="likePost(${post.id})" id="like-${post.id}">❤️ ${post.likes}</button>
                <button>💬 ${post.comments}</button>
                <button>↗️ ${post.shares}</button>
                <button class="primary">➕ Follow</button>
              </div>
            </div>
          </div>
        `).join('');
    }

    function renderDiscover() {
      const pageEl = document.getElementById('page');
      pageEl.innerHTML = `
        <h3>🌍 Discover</h3>
        <div class="card">
          <h3>🔥 Trending Now</h3>
          <div style="display: grid; gap: 10px;">
            <div style="padding: 12px; background: rgba(255,255,255,0.02); border-radius: 10px; cursor: pointer;">
              <div style="font-weight: bold; margin-bottom: 4px;">#DanceChallenge</div>
              <div style="font-size: 12px; color: var(--muted);">2.5M views • Trending</div>
            </div>
            <div style="padding: 12px; background: rgba(255,255,255,0.02); border-radius: 10px; cursor: pointer;">
              <div style="font-weight: bold; margin-bottom: 4px;">#FitnessMotivation</div>
              <div style="font-size: 12px; color: var(--muted);">1.8M views • Trending</div>
            </div>
            <div style="padding: 12px; background: rgba(255,255,255,0.02); border-radius: 10px; cursor: pointer;">
              <div style="font-weight: bold; margin-bottom: 4px;">#MusicProduction</div>
              <div style="font-size: 12px; color: var(--muted);">1.2M views • Trending</div>
            </div>
            <div style="padding: 12px; background: rgba(255,255,255,0.02); border-radius: 10px; cursor: pointer;">
              <div style="font-weight: bold; margin-bottom: 4px;">#ArtTutorial</div>
              <div style="font-size: 12px; color: var(--muted);">890K views • Trending</div>
            </div>
          </div>
        </div>

        <div class="card">
          <h3>👥 Suggested Creators</h3>
          <div style="display: grid; gap: 12px;">
            <div style="display: flex; justify-content: space-between; align-items: center;">
              <div>
                <div style="font-weight: bold;">Dev Ninja 🥷</div>
                <div style="font-size: 12px; color: var(--muted);">2.5K followers</div>
              </div>
              <button class="primary" style="padding: 8px 12px; font-size: 12px;">Follow</button>
            </div>
            <div style="display: flex; justify-content: space-between; align-items: center;">
              <div>
                <div style="font-weight: bold;">Travel Bug 🌴</div>
                <div style="font-size: 12px; color: var(--muted);">3.1K followers</div>
              </div>
              <button class="primary" style="padding: 8px 12px; font-size: 12px;">Follow</button>
            </div>
            <div style="display: flex; justify-content: space-between; align-items: center;">
              <div>
                <div style="font-weight: bold;">Food Master 🍕</div>
                <div style="font-size: 12px; color: var(--muted);">1.8K followers</div>
              </div>
              <button class="primary" style="padding: 8px 12px; font-size: 12px;">Follow</button>
            </div>
          </div>
        </div>

    function renderCreate() {
      const pageEl = document.getElementById('page');
      pageEl.innerHTML = `
        <h3>➕ Create New Content</h3>
        
        <div class="card">
          <h3>📹 Choose Format</h3>
          <div class="chip-grid">
            <button class="primary" style="grid-column: 1;">🎥 Short Video</button>
            <button class="primary" style="grid-column: 2;">🎞️ Long Video</button>
            <button class="primary" style="grid-column: 1;">📢 Status</button>
            <button class="primary" style="grid-column: 2;">🔴 Go Live</button>
          </div>
        </div>

        <div class="card">
          <h3>📋 Create Post</h3>
          <div class="form-group">
            <label>Caption</label>
            <textarea id="postCaption" placeholder="What's on your mind?" style="width: 100%; height: 100px; padding: 12px; border: 1px solid rgba(255,255,255,0.1); background: rgba(255,255,255,0.05); border-radius: 10px; color: var(--text); font-family: inherit; resize: vertical;"></textarea>
          </div>
          <div class="form-group">
            <label>Upload Video/Image</label>
            <input type="file" accept="video/*,image/*" style="width: 100%;" />
          </div>
          <button class="primary" style="width: 100%;" onclick="createPost()">📤 Publish</button>
        </div>
      `;
    }

    function renderChat() {
      const pageEl = document.getElementById('page');
      pageEl.innerHTML = `
        <h3>💬 Messages</h3>
        <div style="display: grid; gap: 10px;">
          ${dummyChats.map(chat => `
            <div class="card" style="padding: 12px 14px; cursor: pointer; display: flex; justify-content: space-between; align-items: center;">
              <div style="display: flex; align-items: center; gap: 12px;">
                <div style="font-size: 32px;">${chat.avatar}</div>
                <div>
                  <div style="font-weight: bold;">${chat.name}</div>
                  <div style="font-size: 12px; color: var(--muted);">${chat.lastMessage}</div>
                </div>
              </div>
              <div style="font-size: 12px; color: var(--muted);">${chat.time}</div>
            </div>
          `).join('')}
        </div>
      `;
    }

    function renderProfile() {
      const pageEl = document.getElementById('page');
      pageEl.innerHTML = `
        <div class="card">
          <div class="profile-header">
            <div class="profile-avatar">${currentUser.avatar}</div>
            <div class="profile-name">${currentUser.name}</div>
            <div class="profile-username">@${currentUser.username}</div>
            <div class="profile-bio">Creating amazing content every day! 🎬✨</div>
          </div>

          <div class="stats">
            <div class="stat-item">
              <div class="stat-value">${currentUser.followers.toLocaleString()}</div>
              <div class="stat-label">Followers</div>
            </div>
            <div class="stat-item">
              <div class="stat-value">${currentUser.following}</div>
              <div class="stat-label">Following</div>
            </div>
            <div class="stat-item">
              <div class="stat-value">${currentUser.posts}</div>
              <div class="stat-label">Posts</div>
            </div>
          </div>

          <div class="action-row" style="justify-content: space-between; margin-top: 20px;">
            <button style="flex: 1; margin-right: 8px;">✏️ Edit Profile</button>
            <button style="flex: 1;">⚙️ Settings</button>
          </div>
        </div>

        <div class="card">
          <h3>📊 Performance</h3>
          <div class="stats">
            <div class="stat-item">
              <div class="stat-value">156K</div>
              <div class="stat-label">Total Views</div>
            </div>
            <div class="stat-item">
              <div class="stat-value">42K</div>
              <div class="stat-label">Total Likes</div>
            </div>
            <div class="stat-item">
              <div class="stat-value">8.2K</div>
              <div class="stat-label">Total Comments</div>
            </div>
          </div>
        </div>

        <div class="card">
          <h3>🎬 My Videos</h3>
          <div style="text-align: center; padding: 20px; color: var(--muted);">
            Your latest videos will appear here
          </div>
        </div>

        <div class="card">
          <button class="danger" style="width: 100%;" onclick="logout()">🚪 Logout</button>
        </div>
      `;
    }

    // Actions
    function likePost(postId) {
      const post = dummyFeed.find(p => p.id === postId);
      post.liked = !post.liked;
      const btn = document.getElementById(`like-${postId}`);
      if (post.liked) {
        post.likes++;
        btn.style.color = var(--danger);
      } else {
        post.likes--;
        btn.style.color = var(--text);
      }
      btn.innerHTML = `❤️ ${post.likes}`;
    }

    function createPost() {
      const caption = document.getElementById('postCaption').value;
      if (caption.trim()) {
        showToast('Post published successfully! 🎉');
        document.getElementById('postCaption').value = '';
      } else {
        showToast('Please add a caption');
      }
    }

    function openNotificationModal() {
      const modal = document.getElementById('notificationModal');
      const list = document.getElementById('notificationList');
      list.innerHTML = dummyNotifications.map(n => `
        <div style="padding: 12px; background: rgba(255,255,255,0.02); border-radius: 10px; margin-bottom: 10px;">
          <div style="font-size: 16px; margin-bottom: 4px;">${n.type}</div>
          <div style="font-size: 14px;">${n.message}</div>
          <div style="font-size: 11px; color: var(--muted); margin-top: 6px;">${n.time}</div>
        </div>
      `).join('');
      modal.classList.add('active');
    }

    function closeNotificationModal() {
      document.getElementById('notificationModal').classList.remove('active');
    }

    function openWalletModal() {
      document.getElementById('walletModal').classList.add('active');
    }

    function closeWalletModal() {
      document.getElementById('walletModal').classList.remove('active');
    }

    function logout() {
      localStorage.removeItem('proliteUser');
      currentUser = null;
      location.reload();
    }

    function showToast(message) {
      const toast = document.createElement('div');
      toast.className = 'toast';
      toast.textContent = message;
      document.body.appendChild(toast);
      setTimeout(() => toast.remove(), 2000);
    }

    // Close modals on outside click
    document.getElementById('notificationModal').addEventListener('click', (e) => {
      if (e.target.id === 'notificationModal') closeNotificationModal();
    });

    document.getElementById('walletModal').addEventListener('click', (e) => {
      if (e.target.id === 'walletModal') closeWalletModal();
    });

    // Initialize
    init();
  </script>
</body>
</html>
